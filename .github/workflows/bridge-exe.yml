# Compila il programma per il PC (companion/metasrc_bridge.py) in un unico MetasrcBridge.exe
# su un PC Windows di GitHub e lo pubblica nella release "bridge" (link di download fisso).
name: Programma PC (exe)

on:
  workflow_dispatch:          # pulsante "Run workflow" nella scheda Actions
  push:
    paths:
      - "companion/**"
      - ".github/workflows/bridge-exe.yml"

permissions:
  contents: write             # serve per pubblicare la release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test
        working-directory: companion
        run: python -m unittest -v test_metasrc_bridge

      - name: Compila MetasrcBridge.exe
        run: |
          python -m pip install --upgrade pip pyinstaller
          pyinstaller --onefile --console --name MetasrcBridge --icon companion/metasrc_bridge.ico companion/metasrc_bridge.py

      - name: Prova veloce dell'exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/MetasrcBridge.exe -PassThru
          Start-Sleep -Seconds 5
          $r = Invoke-RestMethod -Uri http://127.0.0.1:8765/game
          Stop-Process -Id $p.Id -Force
          if ($r.inGame -ne $false) { throw "risposta inattesa: $r" }
          Write-Host "OK: l'exe risponde su /game"

      - name: Scaricabile dalla pagina dell'esecuzione
        uses: actions/upload-artifact@v4
        with:
          name: MetasrcBridge
          path: dist/MetasrcBridge.exe

      - name: Pubblica nella release "bridge"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view bridge >/dev/null 2>&1 || \
            gh release create bridge --title "Metasrc Bridge (programma PC)" \
              --notes "Scarica MetasrcBridge.exe, aprilo con doppio clic e lascialo aperto mentre giochi."
          gh release upload bridge dist/MetasrcBridge.exe --clobber
